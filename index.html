<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>音楽 — Плеер</title>
  
<link rel="manifest" href="manifest.json">

  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Плеер">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href='data:application/manifest+json,{"name":"Плеер","short_name":"Плеер","start_url":".","display":"standalone","background_color":"#000000","theme_color":"#000000"}'>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      overflow: hidden;
      position: relative;
    }

    /* Анимация летящих японских символов на фоне */
    .kanji-bg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .floating-kanji {
      position: absolute;
      color: rgba(255, 255, 255, 0.04);
      font-weight: 900;
      user-select: none;
      filter: blur(8px); /* Размытие символов */
      animation: floatUp linear infinite;
    }

    /* Настройка полос символов */
    .k1 { font-size: 110px; left: 8%; animation-duration: 18s; animation-delay: 0s; }
    .k2 { font-size: 160px; left: 35%; animation-duration: 25s; animation-delay: -5s; filter: blur(12px); }
    .k3 { font-size: 130px; left: 68%; animation-duration: 20s; animation-delay: -10s; }
    .k4 { font-size: 90px; left: 85%; animation-duration: 15s; animation-delay: -3s; filter: blur(6px); }

    @keyframes floatUp {
      0% {
        transform: translateY(110vh) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-20vh) rotate(10deg);
        opacity: 0;
      }
    }

    /* Карточка плеера */
    .player-card {
      position: relative;
      z-index: 1;
      background: rgba(15, 15, 15, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      width: 100%;
      max-width: 380px;
      padding: 28px;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
    }

    /* Шапка */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #888888;
      text-transform: uppercase;
    }

    .app-header span {
      color: #ffffff;
      font-weight: 600;
    }

    /* Обложка */
    .cover {
      width: 180px;
      height: 180px;
      margin: 0 auto 24px;
      background: #0d0d0d;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
    }

    .cover-kanji {
      font-size: 60px;
      color: #ffffff;
    }

    .cover-sub {
      font-size: 10px;
      letter-spacing: 3px;
      color: #666666;
      margin-top: 6px;
    }

    .track-info {
      text-align: center;
      margin-bottom: 22px;
    }

    .track-title {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: #777777;
      margin-top: 4px;
    }

    audio {
      width: 100%;
      margin-bottom: 22px;
      filter: invert(1);
      opacity: 0.9;
    }

    /* Кнопка выбора */
    .file-input-label {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #000000;
      padding: 14px 20px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 22px;
    }

    .file-input-label:active {
      transform: scale(0.97);
      background: #cccccc;
    }

    input[type="file"] {
      display: none;
    }

    /* Плейлист */
    .playlist-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #666666;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .playlist {
      list-style: none;
      max-height: 130px;
      overflow-y: auto;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.5);
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .playlist::-webkit-scrollbar {
      width: 4px;
    }
    .playlist::-webkit-scrollbar-thumb {
      background: #333333;
      border-radius: 4px;
    }

    .playlist li {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #888888;
      transition: all 0.2s;
    }

    .playlist li:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .playlist li.active {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-weight: 600;
      border-left: 2px solid #ffffff;
    }
  </style>
</head>
<body>

  <div class="kanji-bg-container">
    <div class="floating-kanji k1">夢 影 響</div>
    <div class="floating-kanji k2">音 楽 風</div>
    <div class="floating-kanji k3">夜 幻 月</div>
    <div class="floating-kanji k4">光 魂 声</div>
  </div>

  <div class="player-card">
    <div class="app-header">
      <span>オーディオ</span>
      <div>再生中</div>
    </div>

    <div class="cover">
      <div class="cover-kanji">音</div>
      <div class="cover-sub">AUDIO PLAYER</div>
    </div>

    <div class="track-info">
      <div class="track-title" id="title">Выберите трек</div>
      <div class="track-artist" id="artist">Локальный файл</div>
    </div>

    <audio id="audio" controls></audio>

    <label class="file-input-label" for="file-input">
      Выбрать треки с устройства
    </label>
    <input type="file" id="file-input" accept="audio/*, .mp3, .m4a, .wav, .ogg, .aac, .flac, .mp4" multiple>

    <div class="playlist-header">
      <span>Плейлист</span>
      <span>リスト</span>
    </div>
    <ul class="playlist" id="playlist">
      <li style="color: #444444; cursor: default;">Список пуст</li>
    </ul>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const audio = document.getElementById('audio');
    const title = document.getElementById('title');
    const playlistUI = document.getElementById('playlist');

    let playlist = [];
    let currentIndex = 0;

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      playlist = files;
      currentIndex = 0;
      renderPlaylist();
      loadTrack(currentIndex);
    });

    function renderPlaylist() {
      playlistUI.innerHTML = '';
      playlist.forEach((file, index) => {
        const li = document.createElement('li');
        li.textContent = file.name;
        if (index === currentIndex) li.classList.add('active');
        
        li.addEventListener('click', () => {
          currentIndex = index;
          loadTrack(currentIndex);
          audio.play();
        });

        playlistUI.appendChild(li);
      });
    }

    function loadTrack(index) {
      if (!playlist[index]) return;
      
      const file = playlist[index];
      const objectURL = URL.createObjectURL(file);
      
      audio.src = objectURL;
      title.textContent = file.name;

      const items = playlistUI.querySelectorAll('li');
      items.forEach((item, i) => {
        item.classList.toggle('active', i === index);
      });
    }

    audio.addEventListener('ended', () => {
      if (currentIndex + 1 < playlist.length) {
        currentIndex++;
        loadTrack(currentIndex);
        audio.play();
      }
    });
  </script>
</body>
</html>
