<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Музыкальный Плеер</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Плеер">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .player-card {
      background: #1e293b;
      width: 100%;
      max-width: 400px;
      padding: 25px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .cover {
      width: 160px;
      height: 160px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      box-shadow: 0 10px 25px rgba(168, 85, 247, 0.3);
    }

    .track-info {
      text-align: center;
      margin-bottom: 20px;
    }

    .track-title {
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 4px;
    }

    audio {
      width: 100%;
      margin-bottom: 20px;
      outline: none;
    }

    .file-input-label {
      display: block;
      text-align: center;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      margin-bottom: 20px;
    }

    .file-input-label:active {
      transform: scale(0.98);
    }

    input[type="file"] {
      display: none;
    }

    .playlist-title {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .playlist {
      list-style: none;
      max-height: 150px;
      overflow-y: auto;
      border-radius: 12px;
      background: #0f172a;
      padding: 8px;
    }

    .playlist li {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.2s;
    }

    .playlist li:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .playlist li.active {
      background: rgba(168, 85, 247, 0.2);
      color: #c084fc;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="cover">🎧</div>

    <div class="track-info">
      <div class="track-title" id="title">Выберите музыку</div>
      <div class="track-artist" id="artist">Локальный файл</div>
    </div>

    <audio id="audio" controls></audio>

    <label class="file-input-label" for="file-input">
      📂 Выбрать треки с устройства
    </label>
    <input type="file" id="file-input" accept="audio/*" multiple>

    <div class="playlist-title">Плейлист</div>
    <ul class="playlist" id="playlist">
      <li style="color: #64748b; cursor: default;">Список пуст</li>
    </ul>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const audio = document.getElementById('audio');
    const title = document.getElementById('title');
    const playlistUI = document.getElementById('playlist');

    let playlist = [];
    let currentIndex = 0;

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      playlist = files;
      currentIndex = 0;
      renderPlaylist();
      loadTrack(currentIndex);
    });

    function renderPlaylist() {
      playlistUI.innerHTML = '';
      playlist.forEach((file, index) => {
        const li = document.createElement('li');
        li.textContent = file.name;
        if (index === currentIndex) li.classList.add('active');
        
        li.addEventListener('click', () => {
          currentIndex = index;
          loadTrack(currentIndex);
          audio.play();
        });

        playlistUI.appendChild(li);
      });
    }

    function loadTrack(index) {
      if (!playlist[index]) return;
      
      const file = playlist[index];
      const objectURL = URL.createObjectURL(file);
      
      audio.src = objectURL;
      title.textContent = file.name;

      const items = playlistUI.querySelectorAll('li');
      items.forEach((item, i) => {
        item.classList.toggle('active', i === index);
      });
    }

    audio.addEventListener('ended', () => {
      if (currentIndex + 1 < playlist.length) {
        currentIndex++;
        loadTrack(currentIndex);
        audio.play();
      }
    });
  </script>
</body>
</html>
